version: '3.8'

services:
  # Spring Boot Backend Application
  booking-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resource_booking_app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=postgres
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_NAME=booking_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - APPLICATION_SECURITY_JWT_SECRET_KEY=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      - APPLICATION_SECURITY_JWT_EXPIRATION=86400000
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - booking-network

  # PostgreSQL Database Service
  postgres-db:
    image: postgres:16-alpine
    container_name: booking_postgres_db
    environment:
      POSTGRES_DB: booking_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d booking_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - booking-network

  # MySQL Database Service (Alternative Profile)
  mysql-db:
    image: mysql:8.0
    container_name: booking_mysql_db
    environment:
      MYSQL_DATABASE: booking_db
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: booking_user
      MYSQL_PASSWORD: booking_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles:
      - mysql-mode
    networks:
      - booking-network

networks:
  booking-network:
    driver: bridge

volumes:
  postgres_data:
  mysql_data:
