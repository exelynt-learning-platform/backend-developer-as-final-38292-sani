server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: resource-booking-system
  profiles:
    active: h2

  # Default datasource: H2 in-memory
  datasource:
    url: jdbc:h2:mem:bookingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# JWT Configuration
application:
  security:
    jwt:
      # Secret key (256-bit min for HS256)
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      # 24 hours expiration in milliseconds
      expiration: 86400000

# OpenAPI / Swagger Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true

logging:
  level:
    root: INFO
    com.assessment.booking: DEBUG
    org.springframework.security: INFO
